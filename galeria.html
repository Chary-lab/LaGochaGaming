<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Favicon package -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="img/android-chrome-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | LaGochaGaming</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">LAGOCHA<span>GAMING</span></div>
        <div class="nav-links">
            <a href="./#inicio">Inicio</a>
            <a href="./#stream">Directo</a>
            <a href="./#clips">Clips</a>
            <a href="./#social">Social</a>
            <a href="./#youtube">YouTube</a>
            <a href="sorteo" style="color: var(--accent-color);">🎁 Sorteo</a>
            <a href="galeria" style="color: var(--accent-color);">📸 Galería</a>
        </div>
        <div class="auth-buttons">
            <button id="theme-toggle" class="theme-toggle-btn" title="Cambiar tema">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="https://www.tiktok.com/@lagochagaming11" target="_blank" class="btn-login">TikTok</a>
            <a href="https://discord.com/invite/svrteKBbeh" target="_blank" class="btn-login">Discord</a>
        </div>
    </nav>

    <div class="content-section" style="margin-top: 85px;">
        <h1>Mi Galería</h1>
        <div class="upload-container" id="uploadContainer">
            <!-- Campo para que el usuario escriba su propio título -->
            <div style="margin-bottom: 15px;">
                <input type="text" id="imageTitleInput" placeholder="Escribe un título para tu imagen..." maxlength="40" style="width: 100%; max-width: 400px; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg-subtle); color: var(--text-main); font-size: 0.95rem; outline: none;">
            </div>

            <input type="file" id="uploadInput" class="upload-input" accept="image/*">
            <label for="uploadInput" class="upload-label">
                <i class="fas fa-upload"></i> Seleccionar Imagen
            </label>
            <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">Formatos: JPG, PNG, GIF. Tamaño máximo: 5MB por imagen.</p>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-social-icons">
                <a href="https://kick.com/lagochagaming" target="_blank" class="social-icon kick-icon" title="Kick">K</a>
                <a href="https://www.tiktok.com/@lagochagaming11" target="_blank" class="social-icon" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/oscurostefany" target="_blank" class="social-icon" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://discord.com/invite/svrteKBbeh" target="_blank" class="social-icon" title="Discord"><i class="fab fa-discord"></i></a>
                <a href="https://www.youtube.com/@lagochagaming" target="_blank" class="social-icon" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="#" target="_blank" class="social-icon" title="Twitter"><i class="fab fa-x-twitter"></i></a>
                <a href="#" target="_blank" class="social-icon" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            </div>
            <p class="footer-copyright">&copy; 2026 LAGOCHAGAMING - ALL RIGHTS RESERVED</p>
        </div>
    </footer>

    <script>
        const supabaseUrl = 'https://cydiyaacnyydprgffmkq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5ZGl5YWFjbnl5ZHByZ2ZmbWtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjY1ODQsImV4cCI6MjEwNzM0MjU4NH0.fkipcX7Lx4lhGSa0zTDQ9BDNN3jiGTksB2hMlHH1bAs';
        var supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', () => {
            const themeBtn = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme');

            if (currentTheme === 'light') {
                document.body.classList.add('light-mode');
                if (themeBtn) themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('light-mode');
                    let theme = 'dark';
                    if (document.body.classList.contains('light-mode')) {
                        theme = 'light';
                        themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
                    } else {
                        themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                    }
                    localStorage.setItem('theme', theme);
                });
            }
        });

        const lightbox = document.createElement('div');
        lightbox.id = 'lightbox';
        document.body.appendChild(lightbox);

        loadApprovedImages();

        async function loadApprovedImages() {
            try {
                const { data, error } = await supabase.from('galeria').select('image_url, title');
                if (error) return;
                const galleryGrid = document.getElementById('galleryGrid');
                galleryGrid.innerHTML = '';
                data.forEach(image => {
                    const galleryCard = document.createElement('div');
                    galleryCard.className = 'gallery-card';
                    galleryCard.innerHTML = `
                        <img src="${image.image_url}" alt="${image.title}" loading="lazy">
                        <div class="gallery-card-info">
                            <span>${image.title}</span>
                            <button class="like-btn" data-likes="0">
                                <i class="far fa-heart"></i>
                                <span>0</span>
                            </button>
                        </div>
                    `;
                    galleryCard.querySelector('img').addEventListener('click', () => {
                        lightbox.innerHTML = `<img src="${image.image_url}" alt="${image.title}">`;
                        lightbox.style.display = 'flex';
                    });
                    const likeBtn = galleryCard.querySelector('.like-btn');
                    likeBtn.addEventListener('click', () => {
                        let likes = parseInt(likeBtn.getAttribute('data-likes')) || 0;
                        likes++;
                        likeBtn.setAttribute('data-likes', likes);
                        likeBtn.innerHTML = `<i class="fas fa-heart"></i> <span>${likes}</span>`;
                        likeBtn.classList.add('liked');
                    });
                    galleryGrid.prepend(galleryCard);
                });
            } catch (err) { console.error('Error:', err); }
        }

        lightbox.addEventListener('click', () => { lightbox.style.display = 'none'; });

        const uploadContainer = document.getElementById('uploadContainer');
        const uploadInput = document.getElementById('uploadInput');
        const titleInput = document.getElementById('imageTitleInput');

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const customTitle = titleInput.value.trim();

            if (!file) return;

            if (!customTitle) {
                alert("Por favor, escribe un título antes de subir la imagen.");
                uploadInput.value = '';
                return;
            }

            uploadToSupabase(file, customTitle);
        });

        async function uploadToSupabase(file, title) {
            if (file.type.startsWith('image/')) {
                const filePath = `gallery_${Date.now()}_${file.name}`;
                const { error } = await supabase.storage.from('fotos-galeria').upload(filePath, file);
                
                if (error) {
                    alert("Error al subir la imagen.");
                    return;
                }

                const { data: publicURLData } = supabase.storage.from('fotos-galeria').getPublicUrl(filePath);
                
                await saveToSupabaseTable(title, publicURLData.publicUrl);
                
                titleInput.value = '';
                uploadInput.value = '';
            }
        }

        async function saveToSupabaseTable(title, publicUrl) {
            const { error } = await supabase.from('galeria').insert([{ title: title, image_url: publicUrl }]);
            if (!error) {
                loadApprovedImages();
            } else {
                alert("Error al guardar en la base de datos.");
            }
        }
    </script>
</body>
</html>
