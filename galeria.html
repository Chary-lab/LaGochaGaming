</head>
<body>

        <div class="nav-links">

        </div>
    </nav>
    <div class="gallery-container">
        <h1>Mi Galería</h1>
<div class="content-section">
        <h1>Mi Galería</h1>
        <div class="gallery-grid">
            <div class="gallery-card">
                <img src="img/1.jpg" alt="Imagen 1" loading="lazy">
            </div>
            <div class="gallery-card">
                <img src="img/2.jpg" alt="Imagen 2" loading="lazy">
            </div>
            <div class="gallery-card">
                <img src="img/3.jpg" alt="Imagen 3" loading="lazy">
            </div>
            <div class="gallery-card">
                <img src="img/fono.png" alt="Fono" loading="lazy">
            </div>
        </div>
    </div>
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-social-icons">
                <a href="https://kick.com/lagochagaming" target="_blank" class="social-icon kick-icon" title="Kick">K</a>
                <a href="https://www.tiktok.com/@lagochagaming11" target="_blank" class="social-icon" title="TikTok"><i class="fab fa-tiktok"></i></a>

        </div>
    </footer>
    <script>
        // JavaScript for lightbox functionality
        const galleryImages = document.querySelectorAll('.gallery-card img');
        const lightbox = document.createElement('div');
        lightbox.id = 'lightbox';
        document.body.appendChild(lightbox);
        
        galleryImages.forEach(image => {
            image.addEventListener('click', () => {
                lightbox.innerHTML = `<img src="${image.src}" alt="${image.alt}">`;
                lightbox.style.display = 'flex';
            });
        });
        
        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });
    </script>
</body>
</html>
